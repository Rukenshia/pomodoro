; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:az-delivery-devkit-v4]
platform = espressif32
board = az-delivery-devkit-v4
framework = arduino
monitor_speed = 115200
lib_deps = 
	zinggjm/GxEPD2@^1.6.2
	madhephaestus/ESP32Encoder@^0.11.7
	makuna/NeoPixelBus@^2.8.3

; ─── 可选：加一块副屏（B 屏） ───────────────────────────────────────────────
;
; 本 env 的引脚是占位值，跑之前换成你自己的。不用副屏就删掉这一整段，
; 上面的默认 env 编译出来的固件与单屏版本完全一致。
;
; 要点：
;   EPD2_CS   必须与主屏不同（片选独立）
;   EPD2_BUSY 必须独立（忙信号是点对点的，不能共用）
;   EPD2_DC   填与主屏相同的引脚号（两条 SPI 从机共享同一条 DC）
;   EPD2_RST  共用复位线时填 -1，让主屏那次复位统一处理
;   EPD2_3COLOR  三色面板才定义，黑白屏请删掉这一行
;
[env:dual]
extends = env:az-delivery-devkit-v4
build_flags =
    -DEPD2_ENABLE=1
    -DEPD2_DRIVER_CLASS=GxEPD2_420
    -DEPD2_CS=5
    -DEPD2_DC=8
    -DEPD2_BUSY=4
    -DEPD2_RST=-1
    -DREFRESH_MINUTE_ONLY=1

